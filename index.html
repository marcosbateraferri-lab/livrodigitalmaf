
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venda de Livro</title>

<style>
:root {
  --bg:#f6f1e9;
  --card:#fffdf9;
  --tx:#2b2118;
  --mut:#7a6a5a;
  --ac:#8c3b1f;
  --ac2:#6d2d16;
  --bd:#e3d7c6;
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg:#1c1713;
    --card:#272019;
    --tx:#f1e8dc;
    --mut:#b3a28f;
    --ac:#d9774f;
    --ac2:#e89068;
    --bd:#3d3328;
  }
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font-family:Georgia,'Times New Roman',serif;
  line-height:1.6;
}

.wrap {
  max-width:980px;
  margin:0 auto;
  padding:32px 20px;
}

h1 {
  font-size:2rem;
  margin:0 0 4px;
}

.autor {
  color:var(--mut);
  margin:0 0 24px;
  font-style:italic;
}

.grid {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:32px;
  align-items:start;
}

@media(max-width:720px) {
  .grid { grid-template-columns:1fr; }
}

.capa {
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.capa img {
  width:100%;
  border-radius:6px;
  display:block;
  aspect-ratio:2/3;
  object-fit:cover;
  background:var(--bd);
}

.box {
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:20px;
  margin-bottom:18px;
}

.box h2 {
  font-size:1.05rem;
  margin:0 0 10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ac);
}

.isbn {
  font-family:monospace;
  font-size:1.1rem;
}

.preco {
  display:flex;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
}

.de {
  text-decoration:line-through;
  color:var(--mut);
}

.por {
  font-size:2rem;
  font-weight:bold;
}

.info {
  color:var(--mut);
  font-size:.92rem;
  margin:6px 0 0;
}

button,.btn {
  display:inline-block;
  background:var(--ac);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:14px 26px;
  font-size:1.05rem;
  cursor:pointer;
  text-decoration:none;
  font-family:inherit;
}

button:hover,.btn:hover {
  background:var(--ac2);
}

.ok { border-color:#2e7d32; }
.ok h2 { color:#2e7d32; }

.hidden { display:none; }

.aviso {
  font-size:.85rem;
  color:var(--mut);
  margin-top:12px;
}

.erro-capa {
  padding:35px 10px;
  color:var(--mut);
  border:1px dashed var(--bd);
  border-radius:6px;
}
</style>
</head>

<body>

<div class="wrap">

<!-- CONFIGURAÇÃO DO LIVRO -->
<script>
const LIVRO = {
  titulo: "COMO DESTRUIR UM GRUPO DE ORAÇÃO CARISMÁTICO",

  autor: "Marcos Antonio Ferri",

  // Coloque a imagem na mesma pasta deste arquivo HTML.
  // Exemplo: Marquinhos.jpg
  capa: "Marquinhos.jpg",

  resumo: "Uma metanóia na jornada de serviços prestados ao Grupo de Oração Carismático.",

  isbn: "978-65-02-45502-9",

  paginas: "156 páginas",

  formato: "PDF (digital)",

  precoDe: 49.90,

  precoPor: 29.90,

  linkPagamento: "https://mpago.la/236AgU6",

  linkDrive: "https://drive.google.com/drive/u/0/home",

  codigoLiberacao: "LIVRODI"
};
</script>

<h1 id="titulo"></h1>

<p class="autor" id="autor"></p>

<div class="grid">

  <!-- CAPA DO LIVRO -->
  <div class="capa">

    <img
      id="capa"
      alt="Capa do livro"
      onerror="this.style.display='none';
      document.getElementById('erroCapa').style.display='block';"
    >

    <div id="erroCapa" class="erro-capa" style="display:none">
      Imagem da capa não encontrada.
      Verifique o arquivo Marquinhos.jpg.
    </div>

  </div>

  <div>

    <div class="box">
      <h2>Resumo</h2>
      <p id="resumo"></p>
    </div>

    <div class="box">
      <h2>Dados do livro</h2>

      <p>ISBN:
        <span class="isbn" id="isbn"></span>
      </p>

      <p class="info" id="detalhes"></p>
    </div>

    <div class="box">

      <h2>Valores</h2>

      <div class="preco">
        <span class="de" id="de"></span>
        <span class="por" id="por"></span>
      </div>

      <p class="info">
        Pagamento seguro. Acesso liberado após a confirmação.
      </p>

      <p style="margin-top:16px">
        <a
          class="btn"
          id="comprar"
          target="_blank"
          rel="noopener">
          Comprar agora
        </a>
      </p>

    </div>

    <!-- ÁREA DE DOWNLOAD -->

    <div class="box ok hidden" id="download">

      <h2>Pagamento confirmado!</h2>

      <p>
        Obrigado pela compra.
        Clique abaixo para acessar o PDF.
      </p>

      <a
        class="btn"
        id="baixar"
        target="_blank"
        rel="noopener">
        Baixar PDF do livro
      </a>

    </div>

  </div>

</div>

<p class="aviso" id="aviso"></p>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const brl = valor =>
    Number(valor).toLocaleString("pt-BR", {
      style:"currency",
      currency:"BRL"
    });

  // Preenchimento dos dados
  document.title = LIVRO.titulo;

  document.getElementById("titulo").textContent = LIVRO.titulo;

  document.getElementById("autor").textContent =
    "por " + LIVRO.autor;

  document.getElementById("resumo").textContent = LIVRO.resumo;

  document.getElementById("isbn").textContent = LIVRO.isbn;

  document.getElementById("detalhes").textContent =
    LIVRO.paginas + " · " + LIVRO.formato;

  document.getElementById("por").textContent =
    brl(LIVRO.precoPor);

  // Preço anterior
  if (LIVRO.precoDe !== null && LIVRO.precoDe > 0) {

    document.getElementById("de").textContent =
      brl(LIVRO.precoDe);

  } else {

    document.getElementById("de").classList.add("hidden");

  }

  // Link de pagamento
  document.getElementById("comprar").href =
    LIVRO.linkPagamento;

  // IMAGEM DA CAPA
  const imagemCapa = document.getElementById("capa");

  if (LIVRO.capa) {

    imagemCapa.src = LIVRO.capa;

  } else {

    imagemCapa.style.display = "none";

    document.getElementById("erroCapa").style.display = "block";

  }

  // LIBERAÇÃO POR CÓDIGO NA URL
  // Atenção: esta verificação não comprova pagamento.
  const parametros = new URLSearchParams(window.location.search);

  const codigo = parametros.get("liberar");

  if (codigo === LIVRO.codigoLiberacao) {

    document.getElementById("baixar").href =
      LIVRO.linkDrive;

    document.getElementById("download").classList.remove("hidden");

    document.getElementById("comprar").parentElement.classList.add("hidden");

  }

});
</script>

</body>
</html>
